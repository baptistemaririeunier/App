name: Build App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM Toolchain
      uses: meik38/setup-arm-gnu-toolchain@v2
      with:
        arm-gnu-toolchain-version: '13.2.rel1'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build NWA App
      run: |
        make build
